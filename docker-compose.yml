# SpotwebNG — SQLite by default (one container, one volume). Uncomment the
# postgres service and DATABASE_URL for a multi-user / larger install.
services:
  spotwebng:
    build: .
    image: ghcr.io/cyrus109/spotwebng:latest
    container_name: spotwebng
    restart: unless-stopped
    stop_grace_period: 30s  # let a running retrieval commit its chunk
    ports:
      - "7979:7979"
    volumes:
      - spotwebng-data:/data
      # Black-hole folder for "Send to black hole" (Settings -> Download client):
      # - /srv/blackhole:/blackhole
    environment:
      # Everything below is optional — the app generates its own API key and
      # reads the rest from the setup wizard.
      SPOTWEBNEXT_SEED_DEMO_DATA: "false"
      # SPOTWEBNEXT_DATABASE_URL: postgresql+asyncpg://spotweb:secret@db/spotweb
    # depends_on: [db]

  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: spotweb
  #     POSTGRES_PASSWORD: secret
  #     POSTGRES_DB: spotweb
  #   volumes:
  #     - spotwebng-db:/var/lib/postgresql/data

volumes:
  spotwebng-data:
  # spotwebng-db:
