<!DOCTYPE html>
<html lang="en" data-theme="{{ theme | default('liquid-glass') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/design-system.css?v={{ asset_v('css/design-system.css') }}">
  <link rel="stylesheet" href="/static/css/spotwebng.css?v={{ asset_v('css/spotwebng.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-zone">
      <button type="button" class="btn-glass btn-icon-only rail-toggle" id="railToggle" aria-label="Menu">☰</button>
      <a href="/" class="brand">Spotweb<small>NG</small></a>
    </div>
    {% block topbar %}{% endblock %}
    <div class="topbar-zone right">
      <a class="btn-glass btn-icon-only" href="/settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.61.79 1.03 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </a>
    </div>
  </header>
  <div class="shell">
    {% block rail %}{% endblock %}
    <main class="content">
      {% block content %}{% endblock %}
    </main>
    {% block drawer %}{% endblock %}
  </div>
  <script src="/static/js/ui.js?v={{ asset_v('js/ui.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
