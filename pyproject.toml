[project]
name = "spotwebng"
version = "0.2.0"
description = "A modern Spotweb — Spotnet/Usenet indexer with a Newznab API"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Without this, setuptools refuses to build: it finds two top-level directories
# (app and scaffold) and will not guess which is the package.
[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/partials/*.html", "static/**/*", "data/*.json"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4",
  "sqlalchemy[mypy]>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "B008",   # Depends()/Query() in defaults is FastAPI's documented idiom
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
explicit_package_bases = true
namespace_packages = true
# Third-party packages ship partial or no stubs; we type our own code, not theirs.
ignore_missing_imports = true
# Staged adoption: the modules below are checked strictly, the rest are being
# migrated. See .forge/waivers.md.
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["app.spotnet", "app.filters", "app.settings_store", "app.retention"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
# Without a source, a bare `--cov` measures every imported module including
# site-packages: slow, and it makes the threshold meaningless.
source = ["app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
