[project]
name = "spotwebng"
version = "0.2.0"
description = "A modern Spotweb — Spotnet/Usenet indexer with a Newznab API"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "B008",   # Depends()/Query() in defaults is FastAPI's documented idiom
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
explicit_package_bases = true
namespace_packages = true
# Third-party packages ship partial or no stubs; we type our own code, not theirs.
ignore_missing_imports = true
# Staged adoption: the modules below are checked strictly, the rest are being
# migrated. See .forge/waivers.md.
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["app.spotnet", "app.filters", "app.settings_store", "app.retention"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
