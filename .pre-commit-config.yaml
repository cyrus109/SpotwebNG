repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{ id: gitleaks }]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks: [{ id: ruff, args: [--fix] }, { id: ruff-format }]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      # Policy lives in pyproject.toml (scoped to app/, strict per-module while
      # typing is adopted). See .forge/waivers.md.
      - id: mypy
        files: ^app/
        args: [--config-file=pyproject.toml]
        additional_dependencies: ["sqlalchemy[mypy]", "pydantic-settings"]
