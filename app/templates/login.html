{% extends "base.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block content %}
<div class="signin">
  <div class="card signin-card">
    <div class="card-head">
      <div class="card-head-text">
        <h2>Sign in</h2>
        <p class="card-sub">Your Usenet credentials and API keys live behind this login.</p>
      </div>
    </div>

    {% if error %}<div class="signin-error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="card-rows">
        <div class="set-row">
          <div class="set-info">
            <label class="set-name" for="username">Username</label>
          </div>
          <div class="set-control">
            <input type="text" name="username" id="username" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="set-row">
          <div class="set-info">
            <label class="set-name" for="password">Password</label>
          </div>
          <div class="set-control">
            <input type="password" name="password" id="password" autocomplete="current-password" required>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-glass btn-primary signin-submit" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
